<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Output</title>
    <style>
        @page{
            size: A4;
            margin: 2.5cm 1.5cm 3.5cm 1.5cm;

            @top-center{
                content: "Lucas Financial";
            }
            @bottom-right{
                content: "Page " counter(page) " of " counter(pages);
            }
        }
        .logo {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 300px;  /* Adjust width as needed */
            height: auto;
        }
         
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th, .table td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        
        .thead {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <img src="{{ logo_url }}" class="logo">
    <h2>Expense List</h2>

    <table class="table">
        <thead class="thead">
            <tr>
                <th>No</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Description</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ expense.amount }}</td>
                <td>{{ expense.category }}</td>
                <td>{{ expense.description }}</td>
                <td>{{ expense.date }}</td>
            </tr>
            {% endfor %}
            <tr>
                <td>Total</td>
                <td>{{ total }}</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
